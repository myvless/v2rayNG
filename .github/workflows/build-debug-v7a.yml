name: Build Debug APK (armeabi-v7a)

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --install "ndk;28.2.13676358"
        echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV

    - name: Build libhevtun
      run: bash compile-hevtun.sh

    - name: Copy libhevtun
      run: cp -r libs V2rayNG/app

    - name: Fetch AndroidLibXrayLite tag
      run: |
        pushd AndroidLibXrayLite
        CURRENT_TAG=$(git describe --tags --abbrev=0)
        echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
        popd

    - name: Download libv2ray
      uses: robinraju/release-downloader@v1.13
      with:
        repository: '2dust/AndroidLibXrayLite'
        tag: ${{ env.CURRENT_TAG }}
        fileName: 'libv2ray.aar'
        out-file-path: V2rayNG/app/libs/

    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Build Debug APK (armeabi-v7a)
      run: |
        cd V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew :app:assemblePlaystoreDebug -PABI_FILTERS="armeabi-v7a" --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v7
      with:
        name: airport-debug-apk-v7a
        path: V2rayNG/app/build/outputs/apk/playstore/debug/*armeabi-v7a*.apk
